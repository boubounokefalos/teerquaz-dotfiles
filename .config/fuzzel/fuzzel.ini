# Fallback launcher (Super+R): solid #1e2327 panel like the shell's menus (uniformity rule)
[main]
font=Nunito:size=13
use-bold=yes
prompt="  "
icon-theme=Slate-Plus-Dark
terminal=xdg-terminal-exec
layer=overlay
anchor=center
width=36
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=28
fields=filename,name,generic,keywords
match-mode=fzf

[colors]
background=1e2327ff
text=dce4e8ff
prompt=8b9aa2ff
input=f0f4f6ff
placeholder=5c6a72ff
match=64dfdfff
selection=2ec4b6ff
selection-text=181c1fff
selection-match=181c1fff
border=2f383eff

[border]
width=1
radius=16
selection-radius=10
